name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile thesis
        run: latexmk -xelatex -interaction=nonstopmode main.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v5
        with:
          name: thesis-pdf
          path: build/main.pdf
